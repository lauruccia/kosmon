---
# Deploy cPanel — Git Version Control
#
# Modello: il repo e' clonato in una cartella di appoggio e questo script
# copia il codice aggiornato nella cartella live dell'app (DEPLOYPATH).
#
# NON tocca: .env, vendor/, storage/app, public/storage  (non sono nel repo).
# Ogni installazione ha il proprio .env, incluso il flag MLM_ENABLED
# (config/kmoney.php) — stesso codice, comportamento diverso per sito.
#
# NB: NON esegue "composer install" (lento/instabile su hosting condiviso e
# non necessario per modifiche solo-codice). Se in futuro cambi le dipendenze
# (composer.json/lock), aggiorna vendor/ a parte una tantum.
#
# DEPLOYPATH multi-sito, PERCORSI SCRITTI PER ESTESO (fix 31/07/2026 — vedi
# sotto, NON usare piu' $HOME):
#
#   - kosmopay.it: app live in /home2/kosmopay/kosmon (public servito da
#     kosmon/public). PUBLICPATH vuoto: nessuna copia extra.
#
#   - kmoney.it: app live in /home2/kmoney/kosmon_git (STESSA cartella del
#     checkout git), ma il web server serve /home2/kmoney/public_html.
#     Confermato leggendo public_html/index.php il 31/07/2026: usa
#     __DIR__.'/../kosmon_git/...' (percorso RELATIVO), quindi la cartella
#     viva e' per forza quella accanto a public_html. Gli asset di public/
#     vanno quindi copiati anche in public_html — TRANNE index.php, che su
#     kmoney e' personalizzato per puntare a ../kosmon_git e NON va mai
#     sovrascritto.
#
# FIX 31/07/2026 (importante): usavamo "$HOME/kosmon_git" per calcolare il
# percorso live di kmoney.it, assumendo $HOME=/home2/kmoney. Verificato in
# Gestione File pero' che il pannello Git Version Control mostra
# "Repository Path: /home/kmoney/kosmon_git" (senza il 2!) — un valore che
# potrebbe non corrispondere a $HOME durante l'esecuzione dei task di
# deploy. Per eliminare ogni ambiguita' i percorsi ora sono scritti per
# esteso (/home2/kmoney/...), MAI piu' derivati da $HOME. La vecchia copia
# codice->DEPLOYPATH per kmoney e' stata anche rimossa del tutto (non solo
# saltata condizionalmente): su kmoney DEPLOYPATH e' la checkout stessa,
# quindi non c'e' proprio nulla da copiare li' — evita ogni rischio di
# self-copy per sempre, indipendentemente da come si comporta $HOME su
# questo host.
# FIX 28/08/2026 — i percorsi non sono piu' scritti SOLO come /home2/...
# L'hosting ha riferito che in cPanel il repository risulta registrato come
# /home/kmoney/kosmon_git (senza il 2) mentre la home reale dell'account e'
# /home2/kmoney/, e che questo disallineamento lascia il deploy in stato
# "queued". Quel pezzo lo devono sbloccare loro. Ma se lo sbloccano e
# l'ambiente di deploy vede la home come /home/kmoney, i task qui sotto
# uscirebbero comunque con "nessuna cartella live nota trovata": provavano
# SOLO /home2. Ora ogni task prova entrambe le forme, /home2 per prima (cosi'
# su kosmopay, che deploya regolarmente, non cambia assolutamente nulla), e
# il percorso di public_html si ricava dalla cartella trovata invece di
# essere scritto a mano.
#
# REGOLA (dal fix del 25/08): ogni task deve funzionare DA SOLO. cPanel esegue
# ogni riga in una shell propria, quindi niente variabili ereditate dal task
# precedente — ogni riga si ricalcola il percorso.

deployment:
  tasks:

    # Rilevamento della cartella live: /home2 per prima, /home come ripiego.
    - "D=; for c in /home2/kosmopay/kosmon /home/kosmopay/kosmon /home2/kmoney/kosmon_git /home/kmoney/kosmon_git; do if [ -d \"$c\" ]; then D=\"$c\"; break; fi; done; if [ -z \"$D\" ]; then echo 'ERRORE: nessuna cartella live nota trovata, ne sotto /home2 ne sotto /home. Deploy interrotto per sicurezza.' >&2; exit 1; fi; case \"$D\" in */kosmon_git) P=\"${D%/kosmon_git}/public_html\";; *) P=;; esac; echo \"Deploy verso: $D (public: ${P:-standard})\""

    # 1. SOLO kosmopay.it: copia il codice dalla checkout alla cartella live
    #    separata. Su kmoney.it non fa nulla (li' la checkout E' la cartella viva).
    - "D=; for c in /home2/kosmopay/kosmon /home/kosmopay/kosmon; do if [ -d \"$c\" ]; then D=\"$c\"; break; fi; done; if [ -n \"$D\" ]; then /bin/cp -Rf app bootstrap config database public resources routes \"$D\"/; /bin/cp -f artisan composer.json composer.lock \"$D\"/; echo \"Codice copiato in $D\"; fi"

    # 1b. SOLO kmoney.it: aggiorna gli asset in public_html, SENZA toccare
    #     index.php (personalizzato: punta a ../kosmon_git).
    - "D=; for c in /home2/kmoney/kosmon_git /home/kmoney/kosmon_git; do if [ -d \"$c\" ]; then D=\"$c\"; break; fi; done; if [ -n \"$D\" ]; then P=\"${D%/kosmon_git}/public_html\"; cd public && for f in *; do if [ \"$f\" != \"index.php\" ]; then /bin/cp -Rf \"$f\" \"$P\"/; fi; done; cd ..; echo \"Asset aggiornati in $P\"; fi"

    # 2. Svuota le cache cancellando i file compilati, senza dipendere da
    #    php/composer. Prima del 25/08 questo task usava una variabile del task
    #    precedente, non sopravviveva, e falliva in silenzio: la cache non e'
    #    MAI stata svuotata da un deploy.
    - "D=; for c in /home2/kosmopay/kosmon /home/kosmopay/kosmon /home2/kmoney/kosmon_git /home/kmoney/kosmon_git; do if [ -d \"$c\" ]; then D=\"$c\"; break; fi; done; if [ -z \"$D\" ]; then echo 'ERRORE: nessuna cartella live nota trovata: cache non svuotate.' >&2; exit 1; fi; /bin/rm -f \"$D\"/bootstrap/cache/config.php \"$D\"/bootstrap/cache/routes-*.php \"$D\"/bootstrap/cache/packages.php \"$D\"/bootstrap/cache/services.php; /bin/rm -f \"$D\"/storage/framework/views/*.php; echo \"Cache compilate svuotate in $D\""
